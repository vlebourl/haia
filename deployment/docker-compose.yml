services:
  haia:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: haia-api
    restart: unless-stopped
    ports:
      - "${HAIA_PORT:-8000}:8000"
    networks:
      - haia-network
    volumes:
      - ${DATA_DIR:-../data}/haia/logs:/app/logs
      - ${DATA_DIR:-../data}/haia/transcripts:/app/data/transcripts
    environment:
      # LLM Configuration
      HAIA_MODEL: ${HAIA_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30.0}

      # System Prompt Configuration
      HAIA_SYSTEM_PROMPT: ${HAIA_SYSTEM_PROMPT:-}
      HAIA_PROFILE_PATH: ${HAIA_PROFILE_PATH}

      # Application Configuration
      CONTEXT_WINDOW_SIZE: ${CONTEXT_WINDOW_SIZE:-20}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./haia.db}
      HOST: "0.0.0.0"
      PORT: "8000"

      # Conversation Boundary Detection
      TRANSCRIPT_STORAGE_DIR: ${TRANSCRIPT_STORAGE_DIR:-data/transcripts}
      BOUNDARY_IDLE_THRESHOLD_MINUTES: ${BOUNDARY_IDLE_THRESHOLD_MINUTES:-10}
      BOUNDARY_MESSAGE_DROP_THRESHOLD: ${BOUNDARY_MESSAGE_DROP_THRESHOLD:-0.5}
      BOUNDARY_MAX_TRACKED_CONVERSATIONS: ${BOUNDARY_MAX_TRACKED_CONVERSATIONS:-1000}

      # Neo4j Configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # Web Search Configuration (Session 15)
      SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
      SEARCH_TAVILY_API_KEY: ${SEARCH_TAVILY_API_KEY:-}
      SEARCH_BRAVE_API_KEY: ${SEARCH_BRAVE_API_KEY:-}
      SEARCH_GOOGLE_CSE_API_KEY: ${SEARCH_GOOGLE_CSE_API_KEY:-}
      SEARCH_GOOGLE_CSE_ENGINE_ID: ${SEARCH_GOOGLE_CSE_ENGINE_ID:-}
      SEARCH_BACKEND_PRIORITY: ${SEARCH_BACKEND_PRIORITY:-tavily,brave,google_cse}
      SEARCH_CACHE_ENABLED: ${SEARCH_CACHE_ENABLED:-true}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-86400}
      SEARCH_MONTHLY_BUDGET_USD: ${SEARCH_MONTHLY_BUDGET_USD:-10.0}
      SEARCH_DAILY_BUDGET_USD: ${SEARCH_DAILY_BUDGET_USD:-1.0}
      SEARCH_MAX_QUERIES_PER_MINUTE: ${SEARCH_MAX_QUERIES_PER_MINUTE:-30}
      SEARCH_DEFAULT_MAX_RESULTS: ${SEARCH_DEFAULT_MAX_RESULTS:-10}
      SEARCH_REQUEST_TIMEOUT_SECONDS: ${SEARCH_REQUEST_TIMEOUT_SECONDS:-10}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  neo4j:
    image: neo4j:5.15
    container_name: haia-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    networks:
      - haia-network
    volumes:
      - ${DATA_DIR:-../data}/neo4j/data:/data
      - ${DATA_DIR:-../data}/neo4j/logs:/logs
      - ${DATA_DIR:-../data}/neo4j/backups:/backups
    environment:
      # Authentication
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}

      # Plugins (APOC and Graph Data Science)
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"

      # Memory Configuration (4GB heap)
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "1G"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: haia-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    networks:
      - haia-network
    volumes:
      - ${DATA_DIR:-../data}/open-webui:/app/backend/data
    environment:
      # WebUI Configuration
      WEBUI_NAME: "HAIA - Homelab AI Assistant"
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${WEBUI_DEFAULT_USER_ROLE:-user}

      # Disable Ollama (HAIA only)
      ENABLE_OLLAMA_API: "false"

      # Enable OpenAI-compatible API for HAIA
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://haia:8000/v1"
      OPENAI_API_KEYS: "sk-haia-local"
    depends_on:
      haia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  haia-network:
    driver: bridge
    name: haia-network

# Volumes are now bind-mounted to ${DATA_DIR:-../data}/ for easy backup/migration
# This allows you to:
# 1. Backup: tar -czf haia-backup.tar.gz data/
# 2. Migrate: Copy data/ directory to new server
# 3. Access: All data in ./data/ directory (gitignored)
